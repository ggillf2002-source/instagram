<title>official_ramesh_24 • Profile</title>
<style>
:root{--bg:#0b0e12;--panel:#252a30;--panel2:#171b20;--line:#292e35;--muted:#aeb4bf;--white:#f5f6f8;--blue:#5865f2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:86px}
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;background:rgba(11,14,18,.96);z-index:5}
.iconbtn{border:0;background:none;font-size:34px;line-height:1;padding:4px;color:#f4f5f7}
.username{font-size:23px;font-weight:600;display:flex;align-items:center;gap:12px}
.red-dot{width:12px;height:12px;border-radius:50%;background:#f12645;display:inline-block}
.profile-head{padding:12px 24px 0}
.identity{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center}
.avatar-wrap{position:relative;width:150px;height:150px}
.avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;border:1px solid #30353c}
.add-story{position:absolute;right:0;bottom:8px;background:#f7f8fa;color:#111;border:3px solid var(--bg);width:37px;height:37px;border-radius:50%;font-size:27px;line-height:1}
.ask{position:absolute;top:-9px;left:3px;background:#292e36;border-radius:26px;padding:14px 17px;text-align:center;font-size:17px;line-height:1.15;width:132px;box-shadow:0 2px 10px #0006}
.stats{display:flex;justify-content:space-around;gap:10px;text-align:center}
.stat strong{display:block;font-size:26px;font-weight:600;margin-bottom:4px}
.stat span{font-size:21px}
.display-name{font-size:23px;font-weight:700;margin:12px 0 7px 192px}
.bio{font-size:21px;line-height:1.42;margin:0 0 18px}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.pill{border:1px solid #303640;border-radius:30px;padding:9px 14px;font-size:18px;white-space:nowrap;background:transparent}
.pill b{font-weight:700}
.dashboard{background:#292e35;border-radius:15px;padding:22px 24px;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center}
.dashboard strong{font-size:22px;display:block;margin-bottom:3px}
.dashboard span{font-size:18px}
.dot{width:15px;height:15px;background:#5865f2;border-radius:50%}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}
.action{background:#292e35;border:0;border-radius:14px;padding:14px 8px;font-size:21px;font-weight:700}
.highlights{display:flex;gap:22px;overflow-x:auto;padding:4px 0 24px;scrollbar-width:none}
.highlights::-webkit-scrollbar{display:none}
.highlight{flex:0 0 130px;text-align:center;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{width:124px;height:124px;border:3px solid #292e35;border-radius:50%;padding:7px;margin:0 auto 8px}
.ring img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.ring.new{border-color:#e8edf4;display:grid;place-items:center;font-size:55px;font-weight:200}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid #242a31;margin-top:4px}
.tab{height:65px;background:none;border:0;color:#9ba2ad;font-size:30px;position:relative}
.tab.active{color:#f7f8fa}
.tab.active:after{content:"";height:3px;background:#f7f8fa;position:absolute;bottom:0;left:12%;right:12%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.post{aspect-ratio: .78;position:relative;background:#171a20;overflow:hidden;border:0;padding:0}
.post img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;right:10px;top:10px;background:#fff;color:#111;border-radius:6px;font-size:12px;padding:3px 5px}
.bottomnav{position:fixed;bottom:0;left:0;right:0;height:76px;background:rgba(11,14,18,.97);border-top:1px solid #242a31;display:flex;justify-content:space-around;align-items:center;z-index:6}
.bottomnav button{background:none;border:0;font-size:30px;color:#f2f4f7;position:relative}
.bottomnav .mini-avatar{width:37px;height:37px;border-radius:50%;object-fit:cover;border:2px solid #f4f5f7;vertical-align:middle}
.message-dot{position:absolute;width:9px;height:9px;border-radius:50%;background:#f12645;right:-4px;bottom:1px}
.modal-bg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal-bg.show{display:flex}
.modal{background:#20252c;border:1px solid #39414b;border-radius:18px;padding:22px;width:min(420px,100%);box-shadow:0 15px 50px #0009}
.modal h2{margin:0 0 14px;font-size:22px}
.modal p{color:#c5cad2;line-height:1.5}
.modal input,.modal textarea{width:100%;background:#101419;color:#fff;border:1px solid #414954;border-radius:10px;padding:12px;margin:7px 0 12px;font:inherit}
.modal textarea{min-height:85px;resize:vertical}
.modal-actions{display:flex;gap:10px;margin-top:10px}
.modal-actions button{flex:1;border:0;border-radius:10px;padding:12px;background:#343b45;font-weight:700}
.modal-actions .primary{background:#5366f3}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#e9edf5;color:#111;padding:11px 17px;border-radius:30px;font-weight:700;display:none;z-index:30;white-space:nowrap}
.toast.show{display:block}
@media(max-width:520px){
 .topbar{height:66px;padding:0 18px}.username{font-size:20px}.profile-head{padding:10px 20px 0}
 .identity{grid-template-columns:145px 1fr;gap:8px}.avatar-wrap{width:135px;height:135px}
 .display-name{margin-left:153px;font-size:20px;margin-top:8px}
 .stat strong{font-size:23px}.stat span{font-size:18px}
 .bio{font-size:19px;line-height:1.35}
 .pill{font-size:16px;padding:8px 12px}
 .dashboard{padding:19px 20px}.dashboard strong{font-size:20px}.dashboard span{font-size:17px}
 .action{font-size:19px;padding:13px 5px}
 .highlights{gap:17px}.highlight{flex-basis:120px}.ring{width:112px;height:112px}
 .tab{height:59px;font-size:27px}
}
@media(max-width:370px){.identity{grid-template-columns:120px 1fr}.avatar-wrap{width:112px;height:112px}.display-name{margin-left:128px}.stat strong{font-size:20px}.stat span{font-size:16px}.ask{font-size:14px;width:112px}.bio{font-size:17px}}
</style>
</head>

<script>
let toastTimer;
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1900)}
function showModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modalBg').classList.add('show')}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}
function openEdit(){
 showModal(`<h2>Edit profile</h2><label>Name</label><input id="editName" value="${document.getElementById('displayName').textContent}"><label>Bio</label><textarea id="editBio">${document.getElementById('bio').innerText.replace(/<br>/g,'\\n')}</textarea><div class="modal-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveProfile()">Save</button></div>`);
}
function saveProfile(){const n=document.getElementById('editName').value.trim();const b=document.getElementById('editBio').value.trim();if(n)document.getElementById('displayName').textContent=n;if(b)document.getElementById('bio').innerText=b;closeModal();toast('Profile updated on this page')}
async function shareProfile(){const url=location.href;try{if(navigator.share){await navigator.share({title:"it's Ramesh",text:'Check out this profile',url})}else if(navigator.clipboard){await navigator.clipboard.writeText(url);toast('Profile link copied!')}else{showModal(`<h2>Share profile</h2><p>Copy this website link:</p><input value="${url}" readonly><div class="modal-actions"><button onclick="closeModal()">Close</button></div>`)}}catch(e){}}
function openStory(name){showModal(`<h2>${name}</h2><p>This is a sample story highlight in your profile design.</p><div class="modal-actions"><button class="primary" onclick="closeModal()">Close</button></div>`)}
function openPost(name){showModal(`<h2>${name}</h2><p>Sample post preview. Add your own photos and videos to customize this grid.</p><div class="modal-actions"><button class="primary" onclick="closeModal()">Close</button></div>`)}
